name: Python contracts

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  desktop-contracts:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, arch: x64, python: '3.13' }
          - { os: windows-11-arm, arch: arm64, python: '3.13' }
          - { os: ubuntu-24.04, arch: x64, python: '3.13' }
          - { os: ubuntu-24.04-arm, arch: arm64, python: '3.13' }
          - { os: macos-15-intel, arch: x64, python: '3.13' }
          - { os: macos-15, arch: arm64, python: '3.13' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python }} }
      - name: Read-only setup plan
        run: python Tools/setup.py --all --dry-run --format json
      - name: Browser-free contracts
        run: |
          python -m unittest discover -s Tests/Python -p 'test_*.py'
          python Tools/bewerbung.py tests --suite vollstaendig --bericht-path Tests/Artifacts/contracts-${{ matrix.os }}-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-${{ matrix.os }}-${{ matrix.arch }}
          path: Tests/Artifacts
          if-no-files-found: ignore
          retention-days: 7
  minimum-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m unittest discover -s Tests/Python -p 'test_*.py'
