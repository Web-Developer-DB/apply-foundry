name: Prompt regression canary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-regression-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Prompt canary (Linux Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Bubblewrap-Sandbox installieren und prüfen
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          mkdir -p "$RUNNER_TEMP/apply-foundry-bwrap-probe"
          python3 -c 'import sys; from pathlib import Path; from Tools.linux_py.prompt_regression import _require_sandbox; _require_sandbox(Path(sys.argv[1]))' "$RUNNER_TEMP/apply-foundry-bwrap-probe"
      - name: Exakte Prompt-CLI-Versionen installieren
        run: npm install --global @openai/codex@0.148.0-alpha.15 opencode-ai@1.18.18
      - name: Fehlendes Secret fail-closed melden
        if: env.OPENAI_API_KEY == ''
        run: echo "OPENAI_API_KEY fehlt; Prompt-Canary wird absichtlich abgelehnt." && exit 1
      - name: Codex/OpenCode Canary
        run: python3 Tools/bewerbung.py tests --suite prompt-pr --bericht-path Tests/Artifacts/prompt-pr.json
      - name: Bereinigten Promptbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-canary
          path: Tests/Artifacts
          if-no-files-found: ignore
          retention-days: 7
