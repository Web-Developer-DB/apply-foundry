name: Cross-platform browser smoke

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  browser:
    name: Browser / ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, arch: x64 }
          - { os: ubuntu-24.04, arch: x64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Diagnose und Browser-Smoketest
        env:
          APPLY_FOUNDRY_ALLOW_UNSANDBOXED_BROWSER: '1'
        run: |
          python Tools/bewerbung.py diagnose --browser-erforderlich --als-json
          python Tools/bewerbung.py tests --suite browser --bericht-path Tests/Artifacts/browser-${{ matrix.os }}-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.os }}-${{ matrix.arch }}
          path: Tests/Artifacts
          if-no-files-found: ignore
          retention-days: 30
